local_backend: true

backend:
  name: git-gateway

media_folder: "public/assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "A short summary shown on the blog listing page." }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Cover Image Alt Text", name: "coverImageAlt", widget: "string", required: false, hint: "Describe the image for screen readers and SEO." }
      - { label: "Tags", name: "tags", widget: "list", default: ["wellness"] }
      - { label: "Body", name: "body", widget: "markdown" }
